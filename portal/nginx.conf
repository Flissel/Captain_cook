server {
    listen 127.0.0.1:8088;
    server_name _;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        return 404;
    }
}

server {
    listen 8444 ssl;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate /run/portal-tls/portal.crt;
    ssl_certificate_key /run/portal-tls/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /v1/portal/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host mini-pc-portal-link.internal;
        proxy_set_header X-Forwarded-For "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
