name: Gateway and Gate E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mariadb_gateway:
    name: MariaDB Gateway contract
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8.8
        env:
          MARIADB_DATABASE: captain_test
          MARIADB_USER: captain_test
          MARIADB_PASSWORD: captain_ci_password
          MARIADB_ROOT_PASSWORD: captain_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MARIADB_DSN: mariadb://captain_test:captain_ci_password@127.0.0.1:3306/captain_test
      REQUIRE_MARIADB_TESTS: "1"
      OPENAI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Captain dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r minibook/requirements.txt pytest pytest-cov pytest-asyncio
      - name: Exercise MariaDB storage and Gateway without skips
        run: >-
          python -m pytest -q --no-cov -rs
          tests/blockchain/test_mariadb_storage.py
          tests/gateway/test_gateway.py
          tests/gateway/test_agent_runtime.py
      - name: Exercise architecture and CI contracts
        run: >-
          python -m pytest -q --no-cov -rs
          tests/test_architecture_fitness.py
          tests/test_import_boundaries.py
          tests/test_workstream_docs.py
          tests/scripts/test_ci_workflow.py
      - name: Exercise Minibook Forge runtime controls
        run: PYTHONPATH=minibook python -m pytest -q --no-cov minibook/tests

  deterministic_windows:
    name: Windows deterministic runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # windows-latest does not set core.longpaths. This does not fix the
      # tests/agent_factory/test_codex_build_execution.py worktree failures
      # (measured: the real worktree target path is ~216 chars, well under
      # Windows' 260-char MAX_PATH, and disabling this setting locally does
      # not reproduce them either) -- it is kept purely as harmless Windows
      # CI hygiene for any future deeper paths, not as a fix for anything
      # currently failing.
      - name: Enable Windows long paths for git
        shell: pwsh
        run: git config --global core.longpaths true
      - name: DIAGNOSTIC - reproduce git worktree add failure with raw stderr
        shell: pwsh
        run: |
          Write-Host "env:TEMP = $env:TEMP"
          Write-Host "env:RUNNER_TEMP = $env:RUNNER_TEMP"
          # Mirror pytest's actual tmp_path root exactly: pytest's tmp_path_factory
          # defaults to %TEMP%\pytest-of-<user>\pytest-<N>\<test-name><ordinal>,
          # which on this runner is under C:\Users\runneradmin\AppData\Local\Temp
          # -- a different volume than $env:RUNNER_TEMP (D:\a\_temp), which is
          # what the previous diagnostic step used and which did NOT reproduce
          # the failure. Reproduce under the real root this time.
          $pytestRoot = Join-Path $env:TEMP "pytest-of-runneradmin\pytest-0\diag-repro0"
          $repo = Join-Path $pytestRoot "repository"
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          git init -q $repo
          Set-Content -Path (Join-Path $repo "README.md") -Value "diag"
          git -C $repo add README.md
          git -C $repo -c user.name=Diag -c user.email=diag@example.invalid commit -q -m seed
          $rev = git -C $repo rev-parse HEAD
          $target = Join-Path $repo ".captain-cook\private\codex-workspaces\00000000-0000-0000-0000-000000000301\attempt-1-0cc32ca8763446cb"
          Write-Host "target path length: $($target.Length)"
          Write-Host "target: $target"
          $stderr = & git -C $repo worktree add --detach $target $rev 2>&1
          Write-Host "exit code: $LASTEXITCODE"
          Write-Host "raw output/stderr:"
          $stderr | ForEach-Object { Write-Host "  $_" }
          git -C $repo version
          [Environment]::OSVersion | Out-String | Write-Host
          Get-Acl -LiteralPath $pytestRoot | Format-List | Out-String | Write-Host
      - name: Install Captain and Minibook dependencies
        shell: pwsh
        run: >-
          python --version;
          python -m pip install --upgrade pip;
          python -m pip install -r requirements.txt -r minibook/requirements.txt pytest pytest-cov pytest-asyncio
      - name: Exercise complete Windows deterministic suite
        shell: pwsh
        run: python -m pytest -q --no-cov -rs -m "not live" --ignore=tests/live

  gate_e_live:
    name: Gate E live release decision
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows]
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAPTAIN_N8N_API_KEY: ${{ secrets.CAPTAIN_N8N_API_KEY }}
      CAPTAIN_N8N_PORT: ${{ vars.CAPTAIN_N8N_PORT || '5679' }}
      MINIBOOK_BACKEND_URL: ${{ vars.MINIBOOK_BACKEND_URL || 'http://127.0.0.1:3456' }}
      MINIBOOK_API_KEY: ${{ secrets.MINIBOOK_API_KEY }}
      MINIBOOK_PROJECTION_API_KEY: ${{ secrets.MINIBOOK_PROJECTION_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Captain dependencies
        shell: pwsh
        run: python --version; python -m pip install --upgrade pip; python -m pip install -r requirements.txt pytest pytest-cov
      - name: Run three provider traces and fail-closed release decision
        shell: pwsh
        run: pwsh -NoProfile -File scripts/run-gate-e-ci.ps1
