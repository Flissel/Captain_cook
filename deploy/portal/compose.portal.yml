services:
  portal:
    build:
      context: ../../portal
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${CAPTAIN_PORTAL_SUPABASE_URL:?CAPTAIN_PORTAL_SUPABASE_URL is required}
        VITE_SUPABASE_ANON_KEY: ${CAPTAIN_PORTAL_SUPABASE_ANON_KEY:?CAPTAIN_PORTAL_SUPABASE_ANON_KEY is required}
    image: ${CAPTAIN_PORTAL_IMAGE_REFERENCE:-captain-integration-portal:local}
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${CAPTAIN_PORTAL_TLS_CERT_PATH:?CAPTAIN_PORTAL_TLS_CERT_PATH is required}
        target: /run/portal-tls/portal.crt
        read_only: true
      - type: bind
        source: ${CAPTAIN_PORTAL_TLS_KEY_PATH:?CAPTAIN_PORTAL_TLS_KEY_PATH is required}
        target: /run/portal-tls/portal.key
        read_only: true
    restart: unless-stopped
