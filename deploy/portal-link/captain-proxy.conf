server {
    listen 10.77.0.1:443 ssl;
    server_name captain-portal-link.internal;

    ssl_certificate /run/portal-link/captain-server.crt;
    ssl_certificate_key /run/portal-link/captain-server.key;
    ssl_client_certificate /run/portal-link/mini-pc-client-ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /v1/portal/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Captain-Portal-Link-Identity "mini-pc-portal";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
    }

    location / {
        return 404;
    }
}
