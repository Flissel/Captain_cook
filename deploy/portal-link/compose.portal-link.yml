services:
  captain-wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    profiles: ["captain"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - type: bind
        source: ./.secrets/captain/wireguard/captain.conf
        target: /config/wg_confs/wg0.conf
        read_only: true

  captain-portal-link:
    image: nginx:1.27-alpine
    profiles: ["captain"]
    network_mode: host
    depends_on:
      captain-wireguard:
        condition: service_started
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - type: bind
        source: ./captain-proxy.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./.secrets/captain/captain-server.crt
        target: /run/portal-link/captain-server.crt
        read_only: true
      - type: bind
        source: ./.secrets/captain/captain-server.key
        target: /run/portal-link/captain-server.key
        read_only: true
      - type: bind
        source: ./.secrets/captain/mini-pc-client-ca.crt
        target: /run/portal-link/mini-pc-client-ca.crt
        read_only: true

  mini-pc-wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    profiles: ["mini-pc"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - type: bind
        source: ./.secrets/mini-pc/wireguard/mini-pc.conf
        target: /config/wg_confs/wg0.conf
        read_only: true

  mini-pc-portal-link:
    image: nginx:1.27-alpine
    profiles: ["mini-pc"]
    network_mode: host
    depends_on:
      mini-pc-wireguard:
        condition: service_started
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - type: bind
        source: ./mini-pc-proxy.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./.secrets/mini-pc/captain-server-ca.crt
        target: /run/portal-link/captain-server-ca.crt
        read_only: true
      - type: bind
        source: ./.secrets/mini-pc/mini-pc-client.crt
        target: /run/portal-link/mini-pc-client.crt
        read_only: true
      - type: bind
        source: ./.secrets/mini-pc/mini-pc-client.key
        target: /run/portal-link/mini-pc-client.key
        read_only: true
