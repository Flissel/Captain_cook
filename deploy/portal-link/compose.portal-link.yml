services:
  captain-wireguard:
    image: lscr.io/linuxserver/wireguard@sha256:ac43e1226878d2611315172d6ea357a95cb326ee73124b91108118efc8666889
    profiles: ["captain"]
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1 && ip -4 addr show dev wg0 | grep -q '10.77.0.1/30'"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - type: bind
        source: ./.secrets/captain/wireguard/captain.conf
        target: /config/wg_confs/wg0.conf
        read_only: true

  captain-portal-link:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    profiles: ["captain"]
    network_mode: service:captain-wireguard
    depends_on:
      captain-wireguard:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:uid=0,gid=0,mode=0755
      - /var/run:uid=0,gid=0,mode=0755
    volumes:
      - type: bind
        source: ./captain-proxy.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./.secrets/captain/captain-server.crt
        target: /run/portal-link/captain-server.crt
        read_only: true
      - type: bind
        source: ./.secrets/captain/captain-server.key
        target: /run/portal-link/captain-server.key
        read_only: true
      - type: bind
        source: ./.secrets/captain/mini-pc-client-ca.crt
        target: /run/portal-link/mini-pc-client-ca.crt
        read_only: true

  mini-pc-wireguard:
    image: lscr.io/linuxserver/wireguard@sha256:ac43e1226878d2611315172d6ea357a95cb326ee73124b91108118efc8666889
    profiles: ["mini-pc"]
    ports:
      - "${CAPTAIN_PORTAL_MINI_PC_ENDPOINT:-192.168.178.65}:51820:51820/udp"
      - "127.0.0.1:8443:8443/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1 && ip -4 addr show dev wg0 | grep -q '10.77.0.2/30'"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - type: bind
        source: ./.secrets/mini-pc/wireguard/mini-pc.conf
        target: /config/wg_confs/wg0.conf
        read_only: true

  mini-pc-portal-link:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    profiles: ["mini-pc"]
    network_mode: service:mini-pc-wireguard
    user: "101:101"
    depends_on:
      mini-pc-wireguard:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0755
    volumes:
      - type: bind
        source: ./mini-pc-proxy.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./.secrets/mini-pc/captain-server-ca.crt
        target: /run/portal-link/captain-server-ca.crt
        read_only: true
      - type: bind
        source: ./.secrets/mini-pc/mini-pc-client.crt
        target: /run/portal-link/mini-pc-client.crt
        read_only: true
      - type: bind
        source: ./.secrets/mini-pc/mini-pc-client.key
        target: /run/portal-link/mini-pc-client.key
        read_only: true
