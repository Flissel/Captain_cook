server {
    listen 127.0.0.1:8443;
    server_name mini-pc-portal-link.internal;

    location /v1/portal/ {
        proxy_pass https://captain-portal-link.internal;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name captain-portal-link.internal;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/portal-link/captain-server-ca.crt;
        proxy_ssl_certificate /run/portal-link/mini-pc-client.crt;
        proxy_ssl_certificate_key /run/portal-link/mini-pc-client.key;
        proxy_set_header Host captain-portal-link.internal;
    }

    location / {
        return 404;
    }
}
