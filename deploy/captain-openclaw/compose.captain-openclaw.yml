# OpenClaw as Captain's planner (spike, plan 2026-11-07 Phase 5).
#
# Own Compose project and volume names so it never touches other stacks.
# The whole container home is one named volume: Claude Code's binary, its
# login (/home/node/.claude*, /home/node/.local) and OpenClaw state
# (/home/node/.openclaw) must all survive image upgrades.
#
# Validate before starting:
#   docker compose -f deploy/captain-openclaw/compose.captain-openclaw.yml config --quiet
name: captain-openclaw

x-openclaw-env: &openclaw-env
  HOME: /home/node
  TZ: ${TZ:-UTC}
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN is required}
  # Read by openclaw.json via ${CAPTAIN_MCP_TOKEN}; never written into config.
  CAPTAIN_MCP_TOKEN: ${CAPTAIN_MCP_TOKEN:?CAPTAIN_MCP_TOKEN is required}
  CAPTAIN_MCP_URL: ${CAPTAIN_MCP_URL:-http://host.docker.internal:18121/mcp}
  # Workspace outside every hidden directory, so Claude Code's native read
  # denials can cover all of ~/.* (credentials, OpenClaw state, MCP config)
  # by default instead of by a list of known secret files.
  OPENCLAW_WORKSPACE_DIR: /home/node/workspace

services:
  # One-shot seed into the home volume:
  # - openclaw.json only if it is not there yet (OpenClaw rewrites it on
  #   auth login, so an existing config is never overwritten);
  # - the Captain-owned role files (workspace/AGENTS.md, SOUL.md,
  #   IDENTITY.md and the captain-plan skill) and Claude Code's user
  #   settings (native tool denials) on every start, so the repository stays
  #   the source of truth; OpenClaw's one-time BOOTSTRAP.md ritual is removed.
  captain-openclaw-seed:
    image: ${CAPTAIN_OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.10.4}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mkdir -p /home/node/workspace/skills/captain-plan /home/node/.claude &&
        if [ -f /home/node/.openclaw/openclaw.json ]; then
        echo "openclaw.json exists, leaving it unchanged";
        else cp /seed/openclaw.json /home/node/.openclaw/openclaw.json &&
        echo "seeded openclaw.json"; fi &&
        cp /seed/workspace/AGENTS.md /seed/workspace/SOUL.md
        /seed/workspace/IDENTITY.md /home/node/workspace/ &&
        rm -f /home/node/workspace/BOOTSTRAP.md &&
        cp /seed/workspace/skills/captain-plan/SKILL.md
        /home/node/workspace/skills/captain-plan/SKILL.md &&
        cp /seed/claude-settings.json /home/node/.claude/settings.json &&
        echo "seeded Captain role files and Claude Code settings"
    volumes:
      - captain-openclaw-home:/home/node
      - type: bind
        source: ./openclaw.json
        target: /seed/openclaw.json
        read_only: true
      - type: bind
        source: ./workspace
        target: /seed/workspace
        read_only: true
      - type: bind
        source: ./claude-settings.json
        target: /seed/claude-settings.json
        read_only: true
    restart: "no"

  captain-openclaw-gateway:
    image: ${CAPTAIN_OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.10.4}
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    environment: *openclaw-env
    volumes:
      - captain-openclaw-home:/home/node
    ports:
      # Loopback only; 18889 avoids a default OpenClaw install on 18789.
      - "127.0.0.1:${CAPTAIN_OPENCLAW_PORT:-18889}:18789"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      captain-openclaw-seed:
        condition: service_completed_successfully
    init: true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Spike: started by hand, never on Docker Desktop boot.
    restart: "no"

  # CLI shares the gateway's network namespace (OpenClaw's documented shape)
  # and its PID namespace: OpenClaw verifies the state-database owner by PID
  # and refuses state access from a foreign namespace while the gateway runs.
  captain-openclaw-cli:
    image: ${CAPTAIN_OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.10.4}
    entrypoint: ["node", "dist/index.js"]
    environment:
      <<: *openclaw-env
      BROWSER: echo
    volumes:
      - captain-openclaw-home:/home/node
    network_mode: "service:captain-openclaw-gateway"
    pid: "service:captain-openclaw-gateway"
    depends_on:
      - captain-openclaw-gateway
    stdin_open: true
    tty: true
    init: true
    profiles: ["cli"]

volumes:
  captain-openclaw-home:
    name: captain-openclaw-home
