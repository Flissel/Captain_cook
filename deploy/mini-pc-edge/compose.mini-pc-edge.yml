services:
  mini-pc-edge:
    image: nginxinc/nginx-unprivileged:1.27.4-alpine@sha256:62a904036bfc0e4a4f2b556e34cbf17bc136b47fde8cdb4628762725f48c5782
    network_mode: host
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0755
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./.secrets/mini-pc-edge.crt
        target: /run/mini-pc-edge/mini-pc-edge.crt
        read_only: true
      - type: bind
        source: ./.secrets/mini-pc-edge.key
        target: /run/mini-pc-edge/mini-pc-edge.key
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:5443/auth/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
